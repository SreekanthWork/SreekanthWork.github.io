<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="34" fill="#071a38"/><circle cx="1070" cy="-20" r="260" fill="#0e74ff" opacity=".18"/><text x="58" y="62" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6daeff" letter-spacing="3">SQL VALIDATION</text><text x="58" y="105" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">Check → recalculate → compare</text><rect x="58" y="140" width="1084" height="340" rx="20" fill="#0c2347" stroke="#21466f"/><g font-family="monospace" font-size="16"><text x="88" y="184" fill="#8fbfff">-- P&amp;L validation</text><text x="88" y="220" fill="#d9e9ff">SELECT trade_id,</text><text x="108" y="252" fill="#fff">CASE WHEN side = 'BUY'</text><text x="108" y="284" fill="#fff">THEN (exit_price - entry_price) * quantity</text><text x="108" y="316" fill="#fff">ELSE (entry_price - exit_price) * quantity</text><text x="108" y="348" fill="#fff">END AS recalculated_gross_pnl</text><text x="88" y="384" fill="#d9e9ff">FROM trades;</text></g><g font-family="Arial,sans-serif"><rect x="58" y="510" width="330" height="72" rx="16" fill="#fff"/><text x="80" y="538" font-size="11" fill="#71839a">CHECKS COVERED</text><text x="80" y="562" font-size="14" font-weight="700" fill="#071a38">Duplicates · nulls · prices · P&amp;L</text><rect x="408" y="510" width="330" height="72" rx="16" fill="#fff"/><text x="430" y="538" font-size="11" fill="#71839a">PURPOSE</text><text x="430" y="562" font-size="14" font-weight="700" fill="#071a38">Validate source values</text><rect x="758" y="510" width="384" height="72" rx="16" fill="#fff"/><text x="780" y="538" font-size="11" fill="#71839a">PUBLIC PROJECT</text><text x="780" y="562" font-size="14" font-weight="700" fill="#071a38">Synthetic data only</text></g></svg>